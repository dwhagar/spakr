[project]
name = "spakr"
dynamic = ["version"]
description = "Game database web site: characters, items, places, magic and more."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flask>=3.1,<3.2",
    "pydantic>=2.13,<3",
    "spectree>=3.0,<3.1",
    "SQLAlchemy>=2.0,<2.1",
    "PyMySQL>=1.1,<2",
    "alembic>=1.13,<2",
]

[project.scripts]
spakr = "spakr.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "spakr.BASE_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spakr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
